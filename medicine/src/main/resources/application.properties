server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.application.name=Medicine Management
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pharmacy}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
pharmacy.alerts.enabled=${ALERTS_ENABLED:false}
server.error.include-message=always
spring.security.user.name=${STAFF_USER:pharmacist}
