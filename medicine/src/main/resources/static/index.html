<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispensary · Pharmacy management</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <aside>
      <a class="brand" href="#overview"
        ><span class="brandmark">✚</span> Dispensary</a

        <button type="button" data-action="logout">Sign out</button>

      <header>
        <span>Workspace <b>/</b> <strong id="breadcrumb">Overview</strong></span
        ><time></time>

      <div id="view"></div>

    <dialog>
      <div id="dialog-body"></div>
      <button type="button" class="close" aria-label="Close dialog">×</button>
    </dialog>
